<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de acesso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <figure>
            <img src="senac-logo.png" alt=" logo senac" class="logo-senac">
        </figure>
        <h1>Music Hall</h1>

        <form action="acesso" method="get" class="input-whapper">
            <div class="form-usuario">
                <label for="e-mail">E-mail:</label>
                <input type="text" 
                name="e-mail" 
                id="e-mail" 
                required
                placeholder="Digite seu e-mail ou CPF.">
            </div>
            
            <div class="form-usuario">
                <label for="e-mail">Senha:</label>
                <input type="text" 
                name="e-mail" 
                id="e-mail" 
                required
                placeholder="Digite sua senha.">

                <img src="Vector.svg" alt="olho" class="visibilidade">
            </div>
            <p>Esqueceu sua senha?</p>

            <button type="submit" class="Entrar">Entrar</button>
            <button type="submit" class="Cadastrar">Cadastrar</button>
    </header>
</body>
</html>
