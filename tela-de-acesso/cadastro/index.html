<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de acesso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <figure>
            <img src="path-senac.png" alt="logo-da-instituição" class="logo">
        </figure>
        <ol>
            <li>Usuário</li>
            <li>Perfil</li>
            <li>Evento</li>
            <li>Dashboard Adm</li>
            <li>Usuario</li>
        </ol>
    </nav>
            <div class="linha-superior"></div>
    <header>
            <h1>Cadastro de eventos</h1>

        <form action="acesso" method="get" class="input-whapper">
            <div class="form-usuario">
                <label for="nome">Nome:</label>
                <input type="text" 
                name="nome" 
                id="nome" 
                required>
            </div>
            
            <div class="form-usuario">
                <label for="data-evento">Data do evento:</label>
                <input type="text" 
                name="data-evento" 
                id="data-evento" 
                required>
            </div>

             <div class="form-usuario">
                <label for="horario">Horario:</label>
                <input type="text" 
                name="horario" 
                id="horario" 
                required>
            </div>

             <div class="form-usuario">
                <label for="data-evento">Capacidade de pessoas:</label>
                <input type="text" 
                name="capacidade-pessoas" 
                id="capacidade-pessoas" 
                required>
            </div>

             <div class="form-usuario">
                <label for="imagens">Imagem:</label>
                <input type="text" 
                name="iamegns" 
                id="imagens" 
                required>
            </div>

             <div class="form-usuario">
                <label for="local de evento">Local de evento:</label>
                <input type="text" 
                name="local-evento" 
                id="local-evento" 
                required>
            </div>

            <div class="form-usuario">
                <label for="preco">Preço:</label>
                <input type="text" 
                name="preco" 
                id="preco" 
                required>
            </div>

            <div class="continuar">
                <button type="submit" class="button">Continuar cadastro</button>
            </div>

        </form>

        
        <figure>
            <img src="senac.png" alt="direito autoral" class="direito-autoral">
        </figure>
        <div class="linha-horizontal"></div>

    </header>
</body>
</html>
